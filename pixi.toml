"$schema" = "https://pixi.sh/v0.59.0/schema/manifest/schema.json"

[workspace]
name = "icechunk-feedstock"
version = "2026.6.14"  # conda-smithy version used to generate this file
description = "Pixi configuration for conda-forge/icechunk-feedstock"
authors = ["@conda-forge/icechunk"]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64", "win64"]
requires-pixi = ">=0.59.0"

[dependencies]
conda-build = ">=26.3"
conda-forge-ci-setup = "4.*"
python = "3.12.*"

[tasks.inspect-all]
cmd = "inspect_artifacts --all-packages"
description = "List contents of all packages found in conda-build build directory."
[tasks.build]
cmd = "conda-build build recipe"
description = "Build icechunk-feedstock directly (without setup scripts), no particular variant specified"
[tasks.debug]
cmd = "conda-build debug recipe"
description = "Debug icechunk-feedstock directly (without setup scripts), no particular variant specified"
[tasks."build-linux_64_is_python_mintrue"]
cmd = "conda-build build recipe -m .ci_support/linux_64_is_python_mintrue.yaml --suppress-variables --clobber-file .ci_support/clobber_linux_64_is_python_mintrue.yaml"
description = "Build icechunk-feedstock with variant linux_64_is_python_mintrue directly (without setup scripts)"
[tasks."debug-linux_64_is_python_mintrue"]
cmd = "conda-build debug recipe -m .ci_support/linux_64_is_python_mintrue.yaml"
description = "Debug icechunk-feedstock with variant linux_64_is_python_mintrue directly (without setup scripts)"
[tasks."inspect-linux_64_is_python_mintrue"]
